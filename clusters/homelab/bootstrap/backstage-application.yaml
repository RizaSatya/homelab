apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://backstage.github.io/charts
      chart: backstage
      targetRevision: 2.6.3
      helm:
        releaseName: backstage
        valueFiles:
          - $values/platform/control-plane/backstage/values.yaml
    - repoURL: https://github.com/RizaSatya/homelab.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/RizaSatya/homelab.git
      targetRevision: main
      path: platform/control-plane/backstage/rbac
      directory:
        recurse: true
    - repoURL: https://github.com/RizaSatya/homelab.git
      targetRevision: main
      path: platform/control-plane/backstage/runtime
      directory:
        recurse: true
    - repoURL: https://github.com/RizaSatya/homelab.git
      targetRevision: main
      path: platform/control-plane/backstage/argocd
      directory:
        recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: backstage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - DisableClientSideApplyMigration=true
