apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: krr
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:RizaSatya/homelab.git
    targetRevision: main
    path: platform/observability/krr
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true