apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: webapp-deployments-should-define-health-probes
spec:
  background: true
  emitWarning: true
  rules:
    - name: recommend-liveness-and-readiness-probes-on-composed-webapp-deployments
      match:
        any:
          - resources:
              kinds:
                - Deployment
              selector:
                matchLabels:
                  platform.rizaes.com/webapp: "true"
      validate:
        failureAction: Audit
        message: >-
          Crossplane-composed WebApp Deployments should define readinessProbe and livenessProbe.
          This stays in Audit for now because the current WebApp API does not expose probe settings yet.
        foreach:
          - list: "request.object.spec.template.spec.containers[]"
            pattern:
              readinessProbe:
                "?*": "*"
              livenessProbe:
                "?*": "*"
