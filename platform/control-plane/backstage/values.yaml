fullnameOverride: backstage

serviceAccount:
  create: false
  name: backstage
  automountServiceAccountToken: true

backstage:
  replicas: 1
  image:
    repository: ghcr.io/rizasatya/homelab-backstage
    tag: v0.1.0
    pullPolicy: IfNotPresent
  appConfig:
    app:
      title: Homelab Backstage
      baseUrl: http://localhost:7007
    organization:
      name: Riza Homelab
    backend:
      baseUrl: http://localhost:7007
      listen:
        port: 7007
      cors:
        origin: http://localhost:7007
        methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
        credentials: true
      database:
        client: pg
        connection:
          host: backstage-db-rw.backstage.svc.cluster.local
          port: 5432
          user: ${POSTGRES_USER}
          password: ${POSTGRES_PASSWORD}
          database: ${POSTGRES_DB}
      reading:
        allow:
          - host: raw.githubusercontent.com
          - host: github.com
    kubernetes:
      serviceLocatorMethod:
        type: multiTenant
      clusterLocatorMethods:
        - type: config
          clusters:
            - name: homelab
              url: https://kubernetes.default.svc
              authProvider: serviceAccount
              skipTLSVerify: false
              skipMetricsLookup: true
              customResources:
                - group: postgresql.cnpg.io
                  apiVersion: v1
                  plural: clusters
                - group: platform.rizaes.com
                  apiVersion: v1alpha1
                  plural: webapps
    catalog:
      rules:
        - allow: [Component, Group, Location, User]
      locations:
        - type: url
          target: https://raw.githubusercontent.com/RizaSatya/homelab/main/platform/control-plane/backstage/catalog/root.yaml
  envFrom:
    - secretRef:
        name: backstage-db-app
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

service:
  type: ClusterIP

ingress:
  enabled: false

postgresql:
  enabled: false
