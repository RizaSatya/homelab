apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: backstage-db
  namespace: backstage
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  instances: 1
  bootstrap:
    initdb:
      database: backstage
      owner: backstage_app
  storage:
    size: 1Gi
    storageClass: local-path
