backstage:
  image:
    registry: ghcr.io
    repository: backstage/backstage
    pullPolicy: IfNotPresent
    tag: latest

  replicas: 1

  appConfig:
    app:
      baseUrl: http://backstage.backstage.svc.cluster.local:7007
    backend:
      listen:
        port: 7007
      database:
        client: pg
        connection:
          host: backstage-db-rw.backstage.svc.cluster.local
          port: 5432
          user: backstage_app
          password:
            $env: POSTGRES_PASSWORD
          database: backstage
    catalog:
      locations:
        - type: url
          target: https://github.com/RizaSatya/homelab/blob/main/catalog-info.yaml
        
        - type: github-discovery
          target: https://github.com/RizaSatya/homelab
          rules:
            - pattern: apps/*/catalog-info.yaml
      
      rules:
        - allow: [Component, System, Group, Location]

    permission:
      enabled: false

    techdocs:
      builder: local
      generator:
        runIn: local
      publisher:
        type: local

  extraEnvVars:
    - name: POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: backstage-db-app
          key: password

  livenessProbe:
    httpGet:
      path: /.backstage/health/v1/liveness
      port: 7007
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /.backstage/health/v1/readiness
      port: 7007
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

service:
  type: ClusterIP
  ports:
    backend: 7007

ingress:
  enabled: false

postgresql:
  enabled: false

serviceAccount:
  create: false
  name: backstage
