backstage:
  image:
    registry: ghcr.io
    repository: backstage/backstage
    pullPolicy: IfNotPresent
    tag: latest

  replicas: 1

  extraAppConfig:
    - configMapRef: backstage-app-config
      filename: app-config.yaml

  livenessProbe:
    httpGet:
      path: /.backstage/health/v1/liveness
      port: 7007
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /.backstage/health/v1/readiness
      port: 7007
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

service:
  type: ClusterIP
  ports:
    backend: 7007

ingress:
  enabled: false

postgresql:
  enabled: false

serviceAccount:
  create: false
  name: backstage
